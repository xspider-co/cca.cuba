    <div class="moon" style="--i:1"><svg viewBox="0 0 100 100"><use href="#s2" width="100" height="100"/></svg></div>
    <div class="moon" style="--i:2"><svg viewBox="0 0 100 100"><use href="#s3" width="100" height="100"/></svg></div>

  </div>
  <div>
    <h1>Cuba Content Awards</h1>
    <p class="frase">Se está preparando algo a la altura del talento que crea, inspira y mueve a Cuba.</p>

    <p class="fecha">5 de diciembre de 2026, La Habana</p>
    <div class="cuenta">
      <div><b id="cd-d">--</b><i>días</i></div>
      <div><b id="cd-h">--</b><i>horas</i></div>
      <div><b id="cd-m">--</b><i>minutos</i></div>
