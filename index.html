<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CCA — Cuba Content Awards</title>
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Cuba Content Awards" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <header class="brand-mark">CUBA CONTENT AWARDS</header>

  <main class="stage">

    <div class="hero">
      <img
        class="trophy"
        src="brand/trophy-2.jpg"
        alt="Trofeo Cuba Content Awards"
        width="773"
        height="773"
      />
      <p class="event-meta">05 · 12 · 2026 — LA HABANA</p>

      <div class="countdown" role="timer" aria-label="Cuenta regresiva para la gala">
        <div class="countdown__unit">
          <span class="countdown__num" id="cd-days">--</span>
          <span class="countdown__label">Días</span>
        </div>
        <div class="countdown__unit">
          <span class="countdown__num" id="cd-hours">--</span>
          <span class="countdown__label">Horas</span>
        </div>
        <div class="countdown__unit">
          <span class="countdown__num" id="cd-minutes">--</span>
          <span class="countdown__label">Minutos</span>
        </div>
      </div>
    </div>

    <!-- Añadir un <li> por patrocinador cuando entre. -->
    <section class="sponsors" aria-label="Patrocinadores">
      <p class="sponsors__label">Patrocinado por</p>
      <ul class="sponsors__list">
        <li>
          <img class="sponsors__logo sponsors__logo--mark" src="sponsors/aserecar-web.png" alt="Aserecar" width="403" height="404" />
        </li>
        <li>
          <img class="sponsors__logo" src="sponsors/qvapay.png" alt="QvaPay" width="599" height="325" />
        </li>
        <li>
          <img class="sponsors__logo sponsors__logo--mark" src="sponsors/aloha.png" alt="Aloha Varadero Cozy Stays" width="489" height="320" />
        </li>
        <li>
          <img class="sponsors__logo sponsors__logo--mark" src="sponsors/kg.png" alt="KG" width="542" height="640" />
        </li>
        <li>
          <img class="sponsors__logo" src="sponsors/juliana.png" alt="La Juliana" width="565" height="190" />
        </li>
        <li>
          <img class="sponsors__logo" src="sponsors/wapa.png" alt="Wapa" width="608" height="193" />
        </li>
        <li>
          <img class="sponsors__logo" src="sponsors/trama.png" alt="Trama Rooftop" width="620" height="601" />
        </li>
        <li>
          <img class="sponsors__logo sponsors__logo--mark" src="sponsors/autopartes.png" alt="Autopartes" width="600" height="593" />
        </li>
      </ul>
    </section>

  </main>

  <footer class="footer">
    <a
      class="footer__tag"
      href="https://www.instagram.com/cca.cuba/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram de CCA Cuba"
    >@cca.cuba</a>
  </footer>

</body>
</html>
